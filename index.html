<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TeeVibesObr</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #f4f4f4;
    }

    header {
      background: #222;
      color: #fff;
      padding: 1rem;
      text-align: center;
    }

    .container {
      padding: 1rem;
      max-width: 900px;
      margin: auto;
    }

    .product {
      background: white;
      padding: 1rem;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
    }

    .product img {
      width: 150px;
      height: auto;
      border-radius: 4px;
    }

    .details {
      flex: 1;
      margin-left: 1rem;
    }

    .cart {
      background: #fff;
      padding: 1rem;
      border-radius: 8px;
    }

    button {
      background: #007bff;
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background: #0056b3;
    }

    @media (max-width: 600px) {
      .product {
        flex-direction: column;
        text-align: center;
      }

      .details {
        margin-left: 0;
        margin-top: 1rem;
      }

      .product img {
        width: 100%;
        max-width: 250px;
      }
    }
  </style>
</head>
<body>

<header>
  <h1>TeeVibesObr</h1>
</header>

<div class="container">
  <div class="product">
    <img src="https://via.placeholder.com/150" alt="Playera Premium">
    <div class="details">
      <h2>Playera Premium</h2>
      <p>Precio: $220 MXN</p>
      <button onclick="addToCart('Playera Premium', 220)">Agregar al carrito</button>
    </div>
  </div>

  <div class="cart">
    <h3>Carrito</h3>
    <ul id="cart-items"></ul>
    <p><strong>Total: $<span id="total">0</span> MXN</strong></p>
  </div>
</div>

<script>
  let total = 0;

  function addToCart(productName, price) {
    const cartItems = document.getElementById('cart-items');
    const newItem = document.createElement('li');
    newItem.textContent = `${productName} - $${price} MXN`;
    cartItems.appendChild(newItem);

    total += price;
    document.getElementById('total').textContent = total;
  }
</script>

</body>
</html>
